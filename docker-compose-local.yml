services:
  clf-api:
    build: 
      context: ./clf-api
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: clf-api
    volumes:
      - ./clf-api/app:/app
    ports:
      - "8000:8000"
    depends_on:
      - spark-job
    environment:
      - SPARK_API_URL=http://spark-job:8080/v1/trigger-job
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=postgres
      - REDIS_DETECTION_URL=redis://redis-detection-cache:6379/0
    networks:
      - internal

  spark-job:
    build: 
      context: ./spark-job
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: spark-job
    depends_on:
      - redis
      - analyzer
      - minio
      - postgres
    volumes:
      - ./spark-job/app:/app
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-pii-scanner}
      - ANALYZER_URL=http://analyzer:3000/v1
      - ANALYZER_API_KEY=${ANALYZER_API_KEY}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=postgres
      - COMPLETION_API_URL=${COMPLETION_API_URL}
      - API_KEY=${API_KEY}
      - BEARER_TOKEN=${BEARER_TOKEN}
      - SPARK_MASTER_URL=local[*]    
    networks: 
      - internal

